[package]
name = "viper-lang"
version = "0.5.0"
edition = "2021"

[profile.release]
# Enable Link-Time Optimization for better cross-crate optimization
lto = "fat"
# Enable all optimizations
opt-level = 3
# Use release debug assertions for better performance
debug-assertions = false
# Overflow checks can be disabled for maximum performance (optional)
# overflow-checks = false
# Strip debug symbols to reduce binary size
strip = "symbols"
# Panic abort for smaller binaries (no unwinding)
panic = "abort"
# Optimize for size
codegen-units = 1

# PGO-instrumented build profile
# Build with: cargo build --profile pgo-instrument
# Use with: LLVM_PROFILE_FILE="target/pgo-data/viper-%p-%m.profraw" cargo build --profile pgo-instrument
[profile.pgo-instrument]
inherits = "release"
# Keep LTO disabled during instrumentation phase for faster builds
lto = false
# Disable overflow checks for profiling accuracy
overflow-checks = false
# Don't strip for PGO instrumentation
strip = "none"
panic = "unwind"
codegen-units = 16

# PGO-optimized build profile (use after generating profiles)
# Build with: RUSTFLAGS="-Cprofile-use=target/pgo-data/merged.profdata" cargo build --profile pgo
[profile.pgo]
inherits = "release"
# Re-enable LTO for final optimized build
lto = "fat"
overflow-checks = false
strip = "symbols"
panic = "abort"
codegen-units = 1

# Thin LTO profile (faster builds, slightly less optimization)
[profile.release-thin]
inherits = "release"
lto = "thin"

# Minimal size profile for smallest binaries
[profile.release-minimal]
inherits = "release"
opt-level = "z"  # Optimize for size
lto = "thin"
codegen-units = 1
strip = "debuginfo"
panic = "abort"

[dependencies]
# LLVM Bindings (Using master branch for LLVM 21 support)
inkwell = { git = "https://github.com/TheDan64/inkwell", branch = "master", features = ["llvm21-1", "no-libffi-linking"] }
llvm-sys = { version = "211", features = ["prefer-dynamic"] }

# CLI argument parsing
clap = { version = "4.4", features = ["derive"] }

# Error handling
thiserror = "1.0"

# Find executables in PATH
which = "6.0"
rustyline = "14"

# Lazy static initialization
lazy_static = "1.4"

# Regex support for re module
regex = "1.10"

# TOML parsing for vpm (package manager)
toml = "0.8"
serde = { version = "1.0", features = ["derive"] }

# libc for malloc/free in JIT stubs
libc = "0.2"

[build-dependencies]
cc = "1.0"
pkg-config = "0.3"

[[bin]]
name = "viper"
path = "src/main.rs"

[[bin]]
name = "vpm"
path = "src/vpm/main.rs"

